name: Cement Formulation Release

on:
  push:
    tags:
      - "brixta-cement-formulation-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify tag version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#brixta-cement-formulation-v}"
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(
              Path("packages/cement-formulation/pyproject.toml").read_text()
          )
          print(data["project"]["version"])
          PY
          )"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cement-formulation[dev]"
      - run: |
          python -m ruff check             packages/cement-formulation/src             packages/cement-formulation/tests
      - run: python -m pytest packages/cement-formulation/tests -q
      - run: python -m build packages/cement-formulation --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: brixta-cement-formulation-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-cement-formulation
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: brixta-cement-formulation-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: brixta-cement-formulation-dist
          path: release-dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             ./release-dist/*             --generate-notes             --verify-tag
