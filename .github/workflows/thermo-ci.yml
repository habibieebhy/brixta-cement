name: Thermo CI

on:
  push:
    branches: [main]
    paths:
      - "packages/cement-thermo/**"
      - ".github/workflows/thermo-ci.yml"
  pull_request:
    paths:
      - "packages/cement-thermo/**"
      - ".github/workflows/thermo-ci.yml"

permissions:
  contents: read

jobs:
  cement-thermo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cement-thermo[dev]"
      - run: python -m ruff check packages/cement-thermo/src packages/cement-thermo/tests
      - run: python -m pytest packages/cement-thermo/tests -q
      - run: |
          python -m build packages/cement-thermo
          python -m twine check packages/cement-thermo/dist/*
