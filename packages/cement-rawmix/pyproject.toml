[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brixta-cement-rawmix"
version = "0.1.0"
description = "Integration-first cement raw-mix optimization contracts and Pyomo/HiGHS orchestration for BRIXTA Cement."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyomo>=6.10,<7",
    "highspy>=1.8,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.12", "twine>=6"]

[project.urls]
Repository = "https://github.com/habibieebhy/brixta-cement"
Issues = "https://github.com/habibieebhy/brixta-cement/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
